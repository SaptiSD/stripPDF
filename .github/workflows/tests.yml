name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyMuPDF (version pinned in requirements.txt) and pytest
        run: pip install "$(grep -i '^pymupdf' requirements.txt)" -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v
